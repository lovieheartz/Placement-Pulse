<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ascend">
  <defs>
    <radialGradient id="ppDisc" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#26325a"/>
      <stop offset="0.55" stop-color="#141b34"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </radialGradient>
    <linearGradient id="ppRing" x1="14" y1="6" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc0ff"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#3a63ff"/>
    </linearGradient>
    <linearGradient id="ppSheen" x1="32" y1="3" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ppMark" x1="15" y1="40" x2="48" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcd4ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Glassy dark disc + top sheen -->
  <circle cx="32" cy="32" r="30" fill="url(#ppDisc)"/>
  <circle cx="32" cy="32" r="30" fill="url(#ppSheen)"/>

  <!-- Bright glass rim -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#ppRing)" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Glowing pulse line into an upward arrow -->
  <g fill="none" stroke="#5b8cff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 38 H22 L26 43 L30 24 L35 39 L41 32 L47 24"/>
  </g>
  <g fill="none" stroke="url(#ppMark)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 38 H22 L26 43 L30 24 L35 39 L41 32 L47 24"/>
    <path d="M40 23 H48 V31"/>
  </g>
</svg>
