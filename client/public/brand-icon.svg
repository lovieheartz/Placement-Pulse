<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ascend">
  <defs>
    <radialGradient id="disc" cx="0.4" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#243057"/>
      <stop offset="0.55" stop-color="#141c36"/>
      <stop offset="1" stop-color="#0b1022"/>
    </radialGradient>
    <!-- white "glass" rim: bright at top and bottom, fading at the sides (mirrors .liquid-glass ::before) -->
    <linearGradient id="rim" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.66" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="sheen" x1="32" y1="3" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="15" y1="40" x2="48" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcd4ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- dark glassy disc + top sheen -->
  <circle cx="32" cy="32" r="30" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="30" fill="url(#sheen)"/>

  <!-- white glass rim (matches the in-app logo's hairline ring) -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- faint blue under-glow so the mark reads like the glowing in-app version -->
  <g fill="none" stroke="#5b8cff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 38 H22 L26 43 L30 24 L35 39 L41 32 L47 24"/>
  </g>
  <!-- slim pulse line lifting into an upward arrow -->
  <g fill="none" stroke="url(#mark)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 38 H22 L26 43 L30 24 L35 39 L41 32 L47 24"/>
    <path d="M40 23 H48 V31"/>
  </g>
</svg>
