<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; }
        textarea { height: 150px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 20px; background: #f8f9fa; border: 1px solid #dee2e6; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
    </style>
</head>
<body>
    <h1>Resume Analyzer Test</h1>
    
    <form id="uploadForm">
        <div class="form-group">
            <label for="resume">Select Resume File (PDF/DOCX):</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.docx" required>
        </div>
        
        <div class="form-group">
            <label for="jobDescription">Job Description:</label>
            <textarea id="jobDescription" name="jobDescription" placeholder="Paste the job description here..." required></textarea>
        </div>
        
        <button type="submit">Analyze Resume</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            const fileInput = document.getElementById('resume');
            const jobDescInput = document.getElementById('jobDescription');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files[0]) {
                resultDiv.innerHTML = '<div class="result error">Please select a resume file.</div>';
                return;
            }
            
            if (!jobDescInput.value.trim()) {
                resultDiv.innerHTML = '<div class="result error">Please provide a job description.</div>';
                return;
            }
            
            formData.append('resume', fileInput.files[0]);
            formData.append('jobDescription', jobDescInput.value.trim());
            
            resultDiv.innerHTML = '<div class="result">Analyzing resume... Please wait.</div>';
            
            try {
                // Note: You'll need to get a real auth token for this to work
                // For testing, you might need to temporarily bypass auth in the backend
                const response = await fetch('http://localhost:3001/api/resume-analysis/upload', {
                    method: 'POST',
                    headers: {
                        // 'Authorization': 'Bearer YOUR_AUTH_TOKEN_HERE'
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>Analysis Complete!</h3>
                            <p><strong>ATS Score:</strong> ${data.data.atsScore}%</p>
                            <p><strong>Missing Keywords:</strong> ${data.data.missingKeywords.join(', ')}</p>
                            <p><strong>Processing Time:</strong> ${data.data.processingTime}ms</p>
                            <h4>Suggestions:</h4>
                            <ul>
                                ${data.data.suggestions.map(s => `<li><strong>${s.priority.toUpperCase()}:</strong> ${s.suggestion}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result error">Error: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">Network Error: ${error.message}</div>`;
                console.error('Upload error:', error);
            }
        });
    </script>
</body>
</html>
